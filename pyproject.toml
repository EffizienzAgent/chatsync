[project]
name = "chatsync"
authors = [{ name = "EffizienzAgent (Tobias Mende)", email = "oss@effizienzagent.de" }]
description = "Chat history from Beeper for the Frappe Framework"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    "requests",
    "phonenumbers~=9.0",
    "nh3~=0.3",
]

[project.urls]
Repository = "https://github.com/EffizienzAgent/chatsync"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["B904", "E501", "W191", "UP030", "UP031", "UP032"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
